<script type="text/plain" id="t1">
### Chương trình C++ đầu tiên
Một chương trình C++ là một dãy **câu lệnh** được máy tính thực hiện lần lượt từ trên xuống. Trình biên dịch (compiler) dịch mã nguồn `.cpp` thành chương trình chạy được.
```
#include <iostream>
using namespace std;

int main() {
    cout << "Xin chao!" << '\n';
    return 0;
}
```
- `#include <iostream>`: nạp thư viện nhập/xuất để dùng `cin`, `cout`.
- `using namespace std;`: cho phép viết `cout` thay vì `std::cout`.
- `int main() { ... }`: hàm chính, chương trình **bắt đầu chạy từ đây**.
- Mỗi câu lệnh kết thúc bằng dấu chấm phẩy `;`.
- `return 0;`: báo chương trình kết thúc bình thường.
### In ra màn hình với cout
Toán tử `<<` "đẩy" dữ liệu ra màn hình. Có thể nối nhiều phần liên tiếp.
```
cout << "Tong = " << 3 + 4 << '\n';   // Tong = 7
cout << "Dong 1" << endl << "Dong 2"; // 2 dòng
```
> `'\n'` và `endl` đều xuống dòng; trong thi HSG nên dùng `'\n'` vì chạy nhanh hơn.
### Chú thích
- `// ...` chú thích một dòng.
- `/* ... */` chú thích nhiều dòng. Chú thích không được biên dịch, dùng để giải thích code.
### Quy trình làm bài thi
- Viết code trong Dev-C++/Code::Blocks → biên dịch (F9/F11) → sửa lỗi → chạy thử với ví dụ.
- Đặt tên tệp **đúng tên bài** trong đề, ví dụ `DOIGIAY.cpp`, để Themis chấm được.
</script>
<script type="text/plain" id="t2">
### Biến là gì?
**Biến** là một vùng nhớ có **tên**, có **kiểu dữ liệu** và chứa một **giá trị** có thể thay đổi khi chương trình chạy.
```
int tuoi = 13;        // khai báo và gán giá trị ban đầu
double diem = 8.75;
tuoi = tuoi + 1;      // gán giá trị mới: 14
```
### Các kiểu dữ liệu thường dùng
- `int`: số nguyên khoảng ±2,1 tỷ (±2×10^9).
- `long long`: số nguyên rất lớn, khoảng ±9,2×10^18.
- `double`: số thực, khoảng 15 chữ số có nghĩa.
- `char`: một ký tự, viết trong nháy đơn: `'A'`.
- `bool`: `true` hoặc `false`.
- `string`: xâu ký tự, viết trong nháy kép: `"Nhon My"`.
> Đề thi hay cho số tới 10^12, 10^18 → phải dùng `long long`, nếu dùng `int` sẽ bị **tràn số** và ra kết quả sai.
### Nhập dữ liệu với cin
```
int a, b;
cin >> a >> b;          // nhập 2 số cách nhau bởi dấu cách hoặc xuống dòng
cout << a + b << '\n';
```
### In số thực cố định chữ số thập phân
```
#include <iomanip>
double x = 3.14159;
cout << fixed << setprecision(2) << x;   // 3.14
```
### Hằng số và ép kiểu
- `const int MAX = 100000;` — hằng không thể gán lại.
- `int x = 7.9;` → x = 7 (phần thập phân bị cắt bỏ).
- `(double)a / b` — ép a sang số thực để chia ra số thực.
</script>
<script type="text/plain" id="t3">
### Toán tử số học
- `+ - *` cộng, trừ, nhân.
- `/` chia: nếu **cả hai là số nguyên** thì kết quả là **phần nguyên**: `17 / 5 = 3`.
- `%` chia lấy dư (chỉ dùng cho số nguyên): `17 % 5 = 2`.
- Với số âm, C++ cắt bỏ phần thập phân: `-7 / 2 = -3`, `-7 % 2 = -1`.
```
int a = 17, b = 5;
cout << a / b << " " << a % b;        // 3 2
cout << (double)a / b;                // 3.4
```
### Toán tử gán rút gọn, tăng giảm
- `x += 3` tương đương `x = x + 3`; tương tự `-=`, `*=`, `/=`, `%=`.
- `x++` tăng x thêm 1. `int j = i++;` → j nhận giá trị cũ rồi i mới tăng.
### Toán tử so sánh và logic
- So sánh: `== != < > <= >=` cho kết quả `true/false`.
- Logic: `&&` (và), `||` (hoặc), `!` (phủ định).
```
bool chan = (n % 2 == 0);
bool trongDoan = (x >= 1 && x <= 100);
```
### Thứ tự ưu tiên
`! ` → `* / %` → `+ -` → so sánh → `&&` → `||` → gán. Khi không chắc, hãy dùng **dấu ngoặc**.
> Mẹo đổi đơn vị: tách số giây N thành giờ–phút–giây bằng `/` và `%`: giờ = N/3600, phút = N%3600/60, giây = N%60.
</script>
<script type="text/plain" id="t4">
### Câu lệnh if – else
```
if (dieuKien) {
    // làm khi điều kiện đúng
} else {
    // làm khi điều kiện sai
}
```
### Nhiều nhánh: else if
Các điều kiện được kiểm tra **từ trên xuống**, gặp điều kiện đúng đầu tiên thì làm nhánh đó và **bỏ qua** các nhánh còn lại.
```
if (d >= 8) cout << "Gioi";
else if (d >= 6.5) cout << "Kha";
else if (d >= 5) cout << "Trung binh";
else cout << "Yeu";
```
### Kết hợp điều kiện
```
// năm nhuận: chia hết cho 400, hoặc chia hết cho 4 nhưng không chia hết cho 100
if ((y % 4 == 0 && y % 100 != 0) || y % 400 == 0) cout << "Nhuan";
```
### switch – case
Dùng khi so sánh một biến với nhiều **giá trị cụ thể**. Nhớ `break` sau mỗi case, nếu không chương trình chạy tràn xuống case kế tiếp.
```
switch (thu) {
    case 2: cout << "Thu Hai"; break;
    case 3: cout << "Thu Ba"; break;
    default: cout << "Khac";
}
```
### Toán tử 3 ngôi
`int mx = (a > b) ? a : b;` — nếu a > b thì lấy a, ngược lại lấy b.
> Lỗi kinh điển: viết `if (x = 5)` (phép gán) thay vì `if (x == 5)` (phép so sánh).
</script>
<script type="text/plain" id="t5">
### Cấu trúc vòng lặp for
```
for (khởi tạo; điều kiện; bước nhảy) {
    // thân vòng lặp
}
```
Thứ tự thực hiện: **khởi tạo** (1 lần) → kiểm tra **điều kiện** → nếu đúng chạy **thân** → **bước nhảy** → kiểm tra lại điều kiện…
```
int s = 0;
for (int i = 1; i <= n; i++) s += i;   // tổng 1 + 2 + ... + n
```
### Các dạng thường gặp
- Đếm ngược: `for (int i = n; i >= 1; i--)`
- Bước nhảy khác 1: `for (int i = 0; i < 10; i += 3)` → 0 3 6 9
- Đếm số lần: vòng `for (int i = 1; i <= 10; i++)` chạy 10 lần.
### Vòng lặp lồng nhau
```
for (int i = 1; i <= 3; i++)
    for (int j = 1; j <= 4; j++)
        cout << i * j << " ";   // thân trong chạy 3 × 4 = 12 lần
```
### Bài toán mẫu: đếm ước
```
int dem = 0;
for (int i = 1; i <= n; i++)
    if (n % i == 0) dem++;
```
> Không đặt dấu `;` ngay sau `for (...)` — khi đó thân vòng lặp là câu lệnh rỗng!
</script>
<script type="text/plain" id="t6">
### Vòng lặp while
Lặp **khi điều kiện còn đúng**. Dùng khi chưa biết trước số lần lặp.
```
while (n > 0) {
    tong += n % 10;   // lấy chữ số cuối
    n /= 10;          // bỏ chữ số cuối
}
```
### Vòng lặp do – while
Thân vòng lặp chạy **ít nhất 1 lần**, sau đó mới kiểm tra điều kiện.
```
do {
    cin >> n;
} while (n <= 0);     // nhập lại cho đến khi n dương
```
### break và continue
- `break`: thoát ngay khỏi vòng lặp **gần nhất**.
- `continue`: bỏ qua phần còn lại của lần lặp hiện tại, chuyển sang lần lặp tiếp theo.
```
for (int i = 1; i <= 10; i++) {
    if (i % 3 == 0) continue;   // bỏ 3, 6, 9
    if (i > 8) break;           // dừng khi i = 10
    cout << i << " ";           // 1 2 4 5 7 8
}
```
### Ứng dụng: thuật toán Euclid tìm UCLN
```
while (b != 0) {
    int r = a % b;
    a = b;
    b = r;
}
// a là UCLN
```
> Vòng lặp vô hạn thường do quên cập nhật biến điều kiện (ví dụ quên `i++` hoặc `n /= 10`).
</script>
<script type="text/plain" id="t7">
### Vì sao cần hàm?
Hàm giúp **chia bài toán lớn thành phần nhỏ**, tránh viết lặp code, dễ kiểm tra lỗi.
```
kiểuTrảVề tênHàm(danhSáchThamSố) {
    ...
    return giáTrị;
}
```
### Ví dụ
```
bool laNguyenTo(int n) {
    if (n < 2) return false;
    for (int i = 2; i * i <= n; i++)
        if (n % i == 0) return false;
    return true;
}
int main() {
    cout << laNguyenTo(17);   // 1 (true)
}
```
- Hàm không trả về giá trị dùng kiểu `void`.
- Chỉ cần thử chia đến √n vì nếu n = p × q thì một trong hai thừa số ≤ √n.
### Truyền tham trị và tham chiếu
- **Tham trị** `void f(int x)`: hàm nhận **bản sao**, thay đổi x không ảnh hưởng biến gốc.
- **Tham chiếu** `void f(int &x)`: x là **tên gọi khác** của biến gốc, thay đổi x là thay đổi biến gốc.
### Biến cục bộ và toàn cục
- Biến khai báo trong hàm là **cục bộ**: chỉ dùng được trong hàm đó.
- Biến khai báo ngoài mọi hàm là **toàn cục**: hàm nào cũng dùng được, tự khởi tạo bằng 0.
</script>
<script type="text/plain" id="t8">
### Khai báo mảng
Mảng là dãy các phần tử **cùng kiểu**, đánh số **từ 0**.
```
int a[5] = {3, 1, 4, 1, 5};
// a[0]=3, a[1]=1, a[2]=4, a[3]=1, a[4]=5
```
> `int a[5]` chỉ có chỉ số 0..4. Truy cập `a[5]` là **vượt mảng** — lỗi nguy hiểm, chương trình có thể chạy sai mà không báo.
### Nhập và duyệt mảng
```
int n, a[1005];
cin >> n;
for (int i = 0; i < n; i++) cin >> a[i];
for (int i = 0; i < n; i++) cout << a[i] << " ";
```
### Các thao tác cơ bản
- **Tính tổng**: cộng dồn từng phần tử.
- **Tìm max/min**: khởi tạo `mx = a[0]` rồi so sánh với các phần tử còn lại.
- **Đếm** phần tử thỏa điều kiện.
- **Mảng đánh dấu/đếm**: `cnt[x]++` để đếm số lần xuất hiện của giá trị x.
```
int mx = a[0];
for (int i = 1; i < n; i++)
    if (a[i] > mx) mx = a[i];
```
> Mảng khai báo **toàn cục** được khởi tạo toàn số 0 và có thể khai báo kích thước lớn (10^6) mà không bị lỗi bộ nhớ như khai báo trong hàm.
</script>

### Mảng hai chiều
Mảng 2 chiều giống một **bảng** gồm hàng và cột. `a[i][j]` là phần tử ở **hàng i, cột j** (đều đánh số từ 0).
```
int a[3][4];          // 3 hàng, 4 cột = 12 phần tử
int b[2][3] = {{1, 2, 3},
               {4, 5, 6}};   // b[1][2] = 6
```

```
cin >> n >> m;
for (int i = 0; i < n; i++)
    for (int j = 0; j < m; j++)
        cin >> a[i][j];
```
### Các đường đặc biệt (ma trận vuông n × n)
- **Hàng i**: các ô `a[i][0..m-1]`.
- **Cột j**: các ô `a[0..n-1][j]`.
- **Đường chéo chính**: các ô có `i == j`.
- **Đường chéo phụ**: các ô có `i + j == n - 1`.

Rất hay dùng trong bài toán lưới, loang:

int dx[4] = {-1, 1, 0, 0};
int dy[4] = {0, 0, -1, 1};
for (int k = 0; k < 4; k++) {
    int x = i + dx[k], y = j + dy[k];
    if (x >= 0 && x < n && y >= 0 && y < m) { ... }
}
```

### Kiểu string
```
#include <string>
string s = "Tin hoc";
cout << s.size();     // 7 (tính cả dấu cách)

int demSo = 0;
for (char c : s)
    if (c >= '0' && c <= '9') demSo++;
// chuyển ký tự số thành giá trị: '7' - '0' = 7
// chữ thường → hoa: c - 'a' + 'A'  (hoặc toupper(c))
```

<script type="text/plain" id="t11">
### vector – mảng động
`vector` tự thay đổi kích thước, không cần khai báo trước số phần tử.
```
#include <vector>
vector<int> v;            // rỗng
v.push_back(5);           // thêm vào cuối: {5}
v.push_back(2);           // {5, 2}
v.pop_back();             // xóa phần tử cuối: {5}
cout << v.size();         // 1
```
- `vector<int> v(n);` — tạo n phần tử bằng 0.
- `v.front()`, `v.back()` — phần tử đầu, cuối.
- Duyệt: `for (int x : v) cout << x;`
### Thư viện algorithm
```
#include <algorithm>
sort(v.begin(), v.end());                    // tăng dần
sort(v.begin(), v.end(), greater<int>());    // giảm dần
reverse(v.begin(), v.end());                 // đảo ngược
int mx = *max_element(v.begin(), v.end());   // giá trị lớn nhất
int c = count(v.begin(), v.end(), 5);        // đếm số 5
```
- Với mảng thường: `sort(a, a + n);`
- `sort` có độ phức tạp **O(n log n)**, sắp xếp 10^6 số chỉ mất khoảng 0,1 giây.
> Tự viết sắp xếp nổi bọt O(n²) với n = 10^5 sẽ quá thời gian — luôn dùng `sort` của thư viện.
</script>
<script type="text/plain" id="t12">
### struct – gom dữ liệu thành một bản ghi
```
struct HocSinh {
    string ten;
    double diem;
};
HocSinh h = {"An", 8.5};
cout << h.ten << " " << h.diem;   // truy cập bằng dấu chấm
HocSinh ds[100];                  // mảng 100 học sinh
```
### pair – cặp hai giá trị
```

v.push_back({2, 5});
```
Sắp xếp vector pair mặc định: theo `first` tăng dần, nếu bằng nhau thì theo `second` tăng dần.
### Sắp xếp theo tiêu chí riêng (hàm so sánh)
Hàm `cmp(a, b)` trả về `true` nếu **a phải đứng trước b**.
```
bool cmp(HocSinh a, HocSinh b) {
    if (a.diem != b.diem) return a.diem > b.diem;  // điểm giảm dần
    return a.ten < b.ten;                          // bằng điểm: tên tăng dần
}
sort(ds, ds + n, cmp);
```
> Đề thi thường yêu cầu sắp xếp nhiều tiêu chí. Hãy viết điều kiện **ưu tiên cao nhất trước**.

<script type="text/plain" id="t13">
### Đệ quy là gì?
Hàm **đệ quy** là hàm **tự gọi lại chính nó** với dữ liệu nhỏ hơn. Mỗi hàm đệ quy cần 2 phần:
- **Điểm dừng** (trường hợp cơ sở): trả kết quả ngay, không gọi tiếp.
- **Bước đệ quy**: đưa bài toán về bài toán nhỏ hơn cùng dạng.
```
long long gt(int n) {           // n! = n × (n-1)!
    if (n == 0) return 1;       // điểm dừng
    return n * gt(n - 1);       // bước đệ quy
}
```
> Thiếu điểm dừng → hàm gọi mãi không dừng, chương trình bị lỗi **tràn ngăn xếp** (stack overflow).
### Ngăn xếp lời gọi hàm
Khi `gt(3)` gọi `gt(2)`, lời gọi `gt(3)` phải **chờ** cho đến khi `gt(2)` trả về. Các lời gọi xếp chồng lên nhau, lời gọi sau cùng được giải quyết **trước tiên**.
### Đệ quy quay lui: sinh mọi khả năng
```
int n, x[20]; bool dd[20];
void Try(int i) {                 // chọn phần tử thứ i
    for (int v = 1; v <= n; v++)
        if (!dd[v]) {
            x[i] = v; dd[v] = true;
            if (i == n) { for (int k = 1; k <= n; k++) cout << x[k]; cout << '\n'; }
            else Try(i + 1);
            dd[v] = false;           // quay lui: trả lại trạng thái
        }
}
```
Đoạn trên sinh mọi **hoán vị** của 1..n (có n! hoán vị).
> Đệ quy Fibonacci `f(n) = f(n-1) + f(n-2)` viết trực tiếp chạy rất chậm vì tính lặp lại nhiều lần — sẽ được cải tiến bằng quy hoạch động (Bài 23).
</script>
<script type="text/plain" id="t14">
### set – tập hợp có thứ tự, không trùng lặp
```
#include <set>
set<int> s;
s.insert(5); s.insert(1); s.insert(5);   // s = {1, 5}
cout << s.size();                         // 2
if (s.count(1)) cout << "Co 1";           // kiểm tra tồn tại

- Các thao tác `insert`, `erase`, `count`, `find` đều có độ phức tạp **O(log n)**.
- Ứng dụng: loại phần tử trùng, đếm số giá trị khác nhau, tìm nhanh.
### map – bảng tra cứu khóa → giá trị
```
#include <map>
map<string, int> dem;
dem["an"]++; dem["binh"]++; dem["an"]++;
cout << dem["an"];                    // 2
for (auto p : dem)                    // duyệt theo khóa tăng dần
    cout << p.first << " " << p.second << '\n';

- `m[k]` nếu khóa k chưa có sẽ được **tự tạo** với giá trị 0.
- Ứng dụng: đếm tần suất khi giá trị rất lớn (10^9) hoặc là xâu — không dùng mảng đếm được.
> `unordered_set`, `unordered_map` nhanh hơn (trung bình O(1)) nhưng không giữ thứ tự.

<script type="text/plain" id="t15">
### stack – ngăn xếp (LIFO)
**Vào sau – ra trước** (Last In First Out), như chồng đĩa.
```
#include <stack>
stack<int> st;
st.push(1); st.push(2); st.push(3);
cout << st.top();    // 3 — phần tử ở đỉnh
st.pop();            // xóa 3
cout << st.size();   // 2
```
### queue – hàng đợi (FIFO)
**Vào trước – ra trước** (First In First Out), như xếp hàng mua vé.
```
#include <queue>
queue<int> q;
q.push(1); q.push(2); q.push(3);
cout << q.front();   // 1 — người đứng đầu hàng
q.pop();             // 1 rời hàng
```
> Luôn kiểm tra `st.empty()` / `q.empty()` trước khi gọi `top()`, `front()`, `pop()`.
### Ứng dụng tiêu biểu
- **stack**: kiểm tra dãy ngoặc hợp lệ, tính biểu thức, khử đệ quy.
- **queue**: mô phỏng hàng đợi, **duyệt BFS** (Bài 24).
- `priority_queue<int>`: hàng đợi ưu tiên, luôn lấy ra phần tử **lớn nhất** trong O(log n).
### Thuật toán kiểm tra dãy ngoặc
Duyệt từng ký tự: gặp ngoặc **mở** thì đẩy vào stack; gặp ngoặc **đóng** thì đỉnh stack phải là ngoặc mở **cùng loại**, rồi lấy ra. Cuối cùng stack phải **rỗng**.
</script>
<script type="text/plain" id="t16">
### Đọc ghi tệp theo đề thi
Đề thi thường yêu cầu đọc từ tệp `.INP` và ghi ra tệp `.OUT`. Chỉ cần thêm 2 dòng đầu hàm main, phần còn lại vẫn dùng `cin`, `cout`:

    ios::sync_with_stdio(false); cin.tie(0);   // tăng tốc nhập xuất

```
> Sai tên tệp (sai chữ hoa/thường, sai phần mở rộng) là mất **toàn bộ điểm** bài đó. Hãy chép tên tệp từ đề.
### Độ phức tạp thuật toán
Độ phức tạp đo **số phép tính** theo kích thước dữ liệu n. Quy tắc ước lượng: máy chấm làm được khoảng **10^8 phép tính mỗi giây**.
- Một vòng lặp 1..n → **O(n)**; hai vòng lồng nhau → **O(n²)**.
- `sort`, `set`, `map` → **O(n log n)**; tìm kiếm nhị phân → **O(log n)**.
### Chọn thuật toán theo giới hạn n (thời gian 1 giây)
- n ≤ 20 → O(2^n) được (thử mọi tập con).
- n ≤ 500 → O(n³).
- n ≤ 5000 → O(n²).
- n ≤ 10^6 → O(n log n) hoặc O(n).
- n ≤ 10^18 → O(log n) hoặc O(√n) với n ≤ 10^12.
### Kỹ thuật lấy điểm từng phần
Đề HSG thường chia **subtask**: 50% test n nhỏ, 50% test n lớn. Nếu chưa nghĩ ra thuật toán tối ưu, hãy viết cách "trâu" để chắc chắn lấy điểm subtask nhỏ.

<script type="text/plain" id="t17">
### Sắp xếp bằng thư viện
```
sort(a, a + n);              // a[0..n-1] tăng dần
sort(a + 1, a + n + 1);      // a[1..n] khi mảng đánh số từ 1
stable_sort(v.begin(), v.end(), cmp);   // giữ thứ tự cũ của phần tử bằng nhau
```
### Đếm phân phối (counting sort)
Khi giá trị **nhỏ** (ví dụ 0 ≤ a[i] ≤ 10^6), đếm số lần xuất hiện của từng giá trị rồi in lại theo thứ tự — độ phức tạp **O(n + MAX)**, nhanh hơn `sort`.
```
int cnt[1000001];            // toàn cục, tự bằng 0
for (int i = 0; i < n; i++) cnt[a[i]]++;
for (int v = 0; v <= 1000000; v++)
    for (int k = 0; k < cnt[v]; k++) cout << v << " ";
```
### Ứng dụng sau khi sắp xếp
- Các giá trị bằng nhau **đứng liền nhau** → đếm số giá trị khác nhau: đếm vị trí i có `a[i] != a[i-1]`.
- Phần tử nhỏ thứ k là `a[k-1]`.
- Ghép cặp lớn với lớn, nhỏ với nhỏ trong bài tham lam.
> Mảng `cnt` chỉ dùng được khi giá trị không âm và không quá lớn. Giá trị đến 10^9 → dùng `map` hoặc sắp xếp.
</script>
<script type="text/plain" id="t18">
### Ước chung lớn nhất – Bội chung nhỏ nhất
Thuật toán Euclid: `UCLN(a, b) = UCLN(b, a % b)`, dừng khi b = 0.
```
long long ucln(long long a, long long b) {
    while (b != 0) { long long r = a % b; a = b; b = r; }
    return a;
}
long long bcnn = a / ucln(a, b) * b;   // chia trước để tránh tràn số
```
C++17 có sẵn hàm `__gcd(a, b)` hoặc `gcd(a, b)`.
### Kiểm tra số nguyên tố
Thử chia cho i từ 2 đến √n: độ phức tạp O(√n).
### Sàng Eratosthenes – tìm mọi số nguyên tố ≤ N
```
bool hop[1000001];                  // hop[x] = true: x là hợp số
hop[0] = hop[1] = true;
for (int p = 2; p * p <= N; p++)
    if (!hop[p])
        for (int k = p * p; k <= N; k += p) hop[k] = true;
```
- Bắt đầu gạch từ **p × p** vì các bội nhỏ hơn đã bị gạch bởi số nguyên tố nhỏ hơn.
- Độ phức tạp **O(N log log N)** — gần như tuyến tính, sàng đến 10^7 vẫn nhanh.
### Đếm ước
Duyệt i từ 1 đến √n: nếu `n % i == 0` thì có 2 ước là i và n/i (cẩn thận khi i × i = n chỉ tính 1).
</script>
<script type="text/plain" id="t19">
### Bài toán
Cho dãy a[1..n] và q câu hỏi: tính tổng a[l] + … + a[r]. Cộng trực tiếp mỗi câu hỏi mất O(n) → tổng O(n·q), quá chậm khi n, q = 10^5.
### Mảng cộng dồn (prefix sum)
`S[i] = a[1] + a[2] + … + a[i]`, với `S[0] = 0`.
```
S[0] = 0;
for (int i = 1; i <= n; i++) S[i] = S[i-1] + a[i];
// tổng đoạn [l, r]:
cout << S[r] - S[l-1];
```
Chuẩn bị O(n), mỗi câu hỏi O(1) → tổng **O(n + q)**.
> Dùng chỉ số **từ 1** và đặt `S[0] = 0` để công thức đúng cả khi l = 1. Tổng có thể lớn → khai báo S kiểu `long long`.
### Mảng hiệu – cộng một đoạn nhiều lần
Muốn cộng v vào tất cả a[l..r] nhiều lần, chỉ ghi lại ở 2 đầu mút:
```
d[l] += v;  d[r + 1] -= v;
// cuối cùng: a[i] = a[i-1] + d[i]   (cộng dồn mảng d)
```
### Mở rộng 2 chiều
`S[i][j] = S[i-1][j] + S[i][j-1] - S[i-1][j-1] + a[i][j]` — tính tổng hình chữ nhật trong O(1).
</script>
<script type="text/plain" id="t20">
### Ý tưởng
Trên mảng **đã sắp xếp**, so sánh x với phần tử **ở giữa**: nếu x lớn hơn thì bỏ nửa trái, nhỏ hơn thì bỏ nửa phải. Mỗi bước loại một nửa → **O(log n)**: 10^6 phần tử chỉ cần khoảng 20 lần so sánh.
```
int lo = 0, hi = n - 1;
while (lo <= hi) {
    int mid = (lo + hi) / 2;
    if (a[mid] == x) return mid;
    else if (a[mid] < x) lo = mid + 1;
    else hi = mid - 1;
}
return -1;   // không tìm thấy
```
### Hàm có sẵn
- `lower_bound(a, a + n, x) - a`: vị trí đầu tiên có `a[i] >= x`.
- `upper_bound(a, a + n, x) - a`: vị trí đầu tiên có `a[i] > x`.
- Số phần tử bằng x = `upper_bound - lower_bound`.
### Chặt nhị phân kết quả
Khi đề hỏi "giá trị nhỏ nhất/lớn nhất thỏa điều kiện" và điều kiện có tính **đơn điệu** (đúng với k thì cũng đúng với mọi giá trị lớn hơn k), ta chặt nhị phân trên đáp án:
```
long long lo = 0, hi = 1e18, ans = -1;
while (lo <= hi) {
    long long mid = lo + (hi - lo) / 2;
    if (check(mid)) { ans = mid; hi = mid - 1; }
    else lo = mid + 1;
}
```
> Lỗi hay gặp: quên sắp xếp mảng trước khi tìm kiếm nhị phân; vòng lặp vô hạn do cập nhật `lo = mid` thay vì `mid + 1`.
</script>
<script type="text/plain" id="t21">
### Hai con trỏ
Dùng hai chỉ số i, j cùng di chuyển **một chiều** trên mảng, mỗi con trỏ đi tối đa n bước → **O(n)** thay vì O(n²).
### Bài mẫu: tìm cặp có tổng bằng X (mảng đã sắp xếp)
```
int i = 0, j = n - 1;
while (i < j) {
    int t = a[i] + a[j];
    if (t == X) { cout << a[i] << " " << a[j]; break; }
    else if (t < X) i++;     // tổng nhỏ → tăng phần tử trái
    else j--;                // tổng lớn → giảm phần tử phải
}
```
### Cửa sổ trượt độ dài k
Tổng đoạn mới = tổng đoạn cũ **+ phần tử vào − phần tử ra**:
```
long long s = 0;
for (int i = 0; i < k; i++) s += a[i];
long long best = s;
for (int i = k; i < n; i++) {
    s += a[i] - a[i - k];
    best = max(best, s);
}
```
### Đoạn con dài nhất có tổng ≤ S (các số dương)
Mở rộng đầu phải r; khi tổng vượt S thì **tăng đầu trái l** đến khi tổng ≤ S lại.
```
long long s = 0; int l = 0, best = 0;
for (int r = 0; r < n; r++) {
    s += a[r];
    while (s > S) s -= a[l++];
    best = max(best, r - l + 1);
}
```
</script>
<script type="text/plain" id="t22">
### Tham lam là gì?
Ở mỗi bước, chọn phương án **tốt nhất trước mắt** và không quay lại. Thuật toán tham lam thường **ngắn và nhanh**, nhưng **không phải lúc nào cũng đúng** — cần kiểm tra bằng phản ví dụ.
### Ví dụ 1: đổi tiền
Với mệnh giá tiền Việt Nam (1, 2, 5, 10, 20, 50…), chọn tờ **lớn nhất có thể** luôn cho số tờ ít nhất. Nhưng với mệnh giá {1, 3, 4} và số tiền 6: tham lam chọn 4 + 1 + 1 (3 tờ), còn tối ưu là 3 + 3 (2 tờ).
### Ví dụ 2: chọn nhiều hoạt động nhất
Có n hoạt động [bắt đầu, kết thúc], chọn nhiều hoạt động không chồng lên nhau nhất: **sắp xếp theo thời điểm kết thúc tăng dần**, lần lượt chọn hoạt động bắt đầu sau khi hoạt động vừa chọn kết thúc.
```
sort(hd, hd + n, [](pair<int,int> a, pair<int,int> b) {
    return a.second < b.second;            // kết thúc sớm trước
});
int dem = 0, ketThuc = -1;
for (int i = 0; i < n; i++)
    if (hd[i].first >= ketThuc) { dem++; ketThuc = hd[i].second; }
```
### Ví dụ 3: mua được nhiều món nhất
Có M đồng, mua nhiều món nhất → sắp xếp giá tăng dần, mua món **rẻ trước**.
> Tham lam gần như luôn đi kèm **sắp xếp**. Trong phòng thi, nếu không chắc tham lam đúng, hãy thử vài phản ví dụ nhỏ bằng tay.
</script>
<script type="text/plain" id="t23">
### Quy hoạch động (QHĐ)
Giải bài toán lớn từ các **bài toán con nhỏ hơn**, **lưu kết quả** vào mảng để không tính lại. Các bước:
- Định nghĩa **trạng thái**: `dp[i]` nghĩa là gì?
- Tìm **công thức truy hồi**: dp[i] tính từ các dp nhỏ hơn thế nào?
- Xác định **cơ sở** và **thứ tự tính**, rồi lấy **đáp án**.
### Ví dụ 1: leo cầu thang
Mỗi bước leo 1 hoặc 2 bậc, có bao nhiêu cách leo n bậc? Bậc thứ i đến từ bậc i−1 hoặc i−2:
```
f[1] = 1; f[2] = 2;
for (int i = 3; i <= n; i++) f[i] = f[i-1] + f[i-2];
```
### Ví dụ 2: dãy con tăng dài nhất (LIS)
`dp[i]` = độ dài dãy con tăng dài nhất **kết thúc tại a[i]**.
```
for (int i = 0; i < n; i++) {
    dp[i] = 1;
    for (int j = 0; j < i; j++)
        if (a[j] < a[i]) dp[i] = max(dp[i], dp[j] + 1);
}
// đáp án = giá trị lớn nhất trong dp
```
### Ví dụ 3: cái túi 0/1
n đồ vật (khối lượng w, giá trị v), túi chứa tối đa W. `dp[j]` = giá trị lớn nhất với tổng khối lượng ≤ j:
```
for (int i = 0; i < n; i++)
    for (int j = W; j >= w[i]; j--)      // j giảm dần: mỗi đồ chỉ lấy 1 lần
        dp[j] = max(dp[j], dp[j - w[i]] + v[i]);
```
> So với đệ quy thuần (hàm mũ), QHĐ chỉ tốn O(số trạng thái × chi phí chuyển).
</script>
<script type="text/plain" id="t24">
### Biểu diễn lưới và đồ thị
Bài toán lưới: mỗi ô là một **đỉnh**, hai ô kề cạnh được nối với nhau. Đồ thị tổng quát lưu bằng **danh sách kề**: `vector<int> ke[N];`.
### BFS – duyệt theo chiều rộng
Duyệt **từng lớp** từ điểm xuất phát bằng **queue** → tìm **đường đi ngắn nhất** trên lưới/đồ thị không trọng số.
```
queue<pair<int,int>> q;
memset(d, -1, sizeof d);         // -1: chưa thăm
d[sx][sy] = 0; q.push({sx, sy});
while (!q.empty()) {
    auto [x, y] = q.front(); q.pop();
    for (int k = 0; k < 4; k++) {
        int u = x + dx[k], v = y + dy[k];
        if (u >= 0 && u < n && v >= 0 && v < m && a[u][v] != '#' && d[u][v] == -1) {
            d[u][v] = d[x][y] + 1;
            q.push({u, v});
        }
    }
}
```
### DFS – duyệt theo chiều sâu
Đi sâu hết mức rồi mới quay lại, viết bằng **đệ quy**. Thường dùng để **đếm vùng liên thông**:
```
void dfs(int x, int y) {
    vis[x][y] = true;
    for (int k = 0; k < 4; k++) {
        int u = x + dx[k], v = y + dy[k];
        if (u >= 0 && u < n && v >= 0 && v < m && a[u][v] == '.' && !vis[u][v]) dfs(u, v);
    }
}
// số vùng = số lần phải gọi dfs từ một ô chưa thăm
```
> Luôn có mảng **đánh dấu đã thăm** (d hoặc vis) để không thăm một ô hai lần. Độ phức tạp O(n × m).
</script>

 function step(){let q=p+1;while(q*q<=N&&hop[q])q++;if(q*q>N){cur=0;newly=[];const c=[...Array(N+1).keys()].filter(x=>x>=2&&!hop[x]).length;p=N;draw(`p = ${q} có p × p = ${q*q} > ${N} → <b>dừng</b>. Các số còn lại đều nguyên tố: có <b>${c}</b> số nguyên tố ≤ ${N}.`);return}
  p=q;cur=q;newly=[];for(let k=q*q;k<=N;k+=q)if(!hop[k]){hop[k]=true;newly.push(k)}draw(`p = <b>${q}</b> là số nguyên tố. Gạch các bội từ ${q} × ${q} = ${q*q}: gạch mới ${newly.length} số (ô đỏ).`)}
 function draw(m){$('#m18',h).innerHTML=m;let g='';for(let x=1;x<=N;x++){const cls=x===1?'dim':x===cur?'mk':newly.includes(x)?'no':hop[x]?'dim':(p>=N&&x>=2?'hi':'');g+=`<div class="cell ${cls}" style="min-width:0;${cls==='no'?'border-color:#ef4444;background:#fee2e2;text-decoration:line-through':''}${cls==='dim'?';text-decoration:line-through':''}">${x}</div>`}$('#g18',h).innerHTML=g}
 $('#nx18',h).onclick=()=>{if(p<N)step()};$('#rs18',h).onclick=reset;$('#N18',h).onchange=reset;reset();
 function eu(){let a=num($('#ea',h).value,1,1e9),b=num($('#eb',h).value,0,1e9);if(a===null||b===null){$('#e18',h).innerHTML='<span class="bad">Nhập số nguyên dương.</span>';return}const A=a,B=b;let r='';while(b){r+=`<tr><td class="mono">${a}</td><td class="mono">${b}</td><td class="mono">${a} % ${b} = ${a%b}</td></tr>`;[a,b]=[b,a%b]}
  $('#e18',h).innerHTML=`<table class="tbl" style="max-width:480px"><tr><th>a</th><th>b</th><th>r = a % b</th></tr>${r}<tr><td class="mono"><b>${a}</b></td><td class="mono">0</td><td>b = 0 → dừng</td></tr></table><div class="note">UCLN(${A}, ${B}) = <b>${a}</b> · BCNN = ${A} / ${a} × ${B} = <b>${A/a*B}</b> · chỉ mất ${r.split('<tr>').length-1} bước.</div>`}
 h.querySelectorAll('#ea,#eb').forEach(e=>e.oninput=eu);eu();}},
19:{t:'Tổng đoạn bằng mảng cộng dồn',f(h){
 h.innerHTML=`<div class="row"><label class="lab">a[1..n] = <input id="a19" value="3 -1 4 1 5 9 2 6" style="width:240px"></label><label class="lab">l = <input id="l19" value="3" style="width:60px"></label><label class="lab">r = <input id="r19" value="6" style="width:60px"></label></div><div id="o19"></div>`;
 function u(){const a=$('#a19',h).value.trim().split(/[\s,]+/).map(Number).filter(Number.isFinite).slice(0,14),n=a.length,l=num($('#l19',h).value,1,n),r=num($('#r19',h).value,1,n);const S=[0];a.forEach((x,i)=>S.push(S[i]+x));
  if(l===null||r===null||l>r){$('#o19',h).innerHTML=`<span class="bad">Cần 1 ≤ l ≤ r ≤ ${n}.</span>`;return}

  <pre class="code">${hl(`cout << S[${r}] - S[${l-1}];   // ${S[r]} - ${S[l-1]}`)}</pre><div class="note">Tổng a[${l}] + … + a[${r}] = S[${r}] − S[${l-1}] = <b>${S[r]-S[l-1]}</b> — chỉ <b>1 phép trừ</b> thay vì ${r-l} phép cộng.</div>`}

20:{t:'Chạy từng bước tìm kiếm nhị phân',f(h){Tracer(h,{inputs:[{id:'a',label:'Mảng (tự sắp xếp) =',val:'2 5 8 12 16 23 38 56 72 91',w:240},{id:'x',label:'x =',val:'23',w:60}],
 code:['int lo = 0, hi = n - 1;','while (lo <= hi) {','    int mid = (lo + hi) / 2;','    if (a[mid] == x) { cout << mid; return 0; }','    else if (a[mid] < x) lo = mid + 1;','    else hi = mid - 1;','}','cout << -1;'],
 gen(v){const a=v.a.trim().split(/[\s,]+/).map(Number).sort((p,q)=>p-q),x=Number(v.x);if(!a.length||a.length>16||a.some(t=>!Number.isInteger(t))||!Number.isInteger(x))return'Nhập 1–16 số nguyên và x nguyên.';
  const {steps,P,O}=mk();let lo=0,hi=a.length-1,c=0;const X=(m)=>({arr:a,hi:m,rg:[lo,hi],l1:'Vùng còn tìm (ô mờ đã bị loại):'});P(0,`Vùng tìm kiếm ban đầu [${lo}, ${hi}].`,{lo,hi},X(-1));
  while(true){const ok=lo<=hi;P(1,`\`${lo} <= ${hi}\` → ${ok?'còn phần tử để tìm':'**hết vùng tìm kiếm**'}.`,{lo,hi},X(-1));if(!ok)break;c++;
   const mid=Math.floor((lo+hi)/2);P(2,`mid = (${lo} + ${hi}) / 2 = **${mid}**, a[mid] = ${a[mid]}.`,{lo,hi,mid},X(mid));
   if(a[mid]===x){O(String(mid));P(3,`a[${mid}] = ${x} → **tìm thấy** sau ${c} lần so sánh!`,{lo,hi,mid},X(mid));return steps}
   if(a[mid]<x){lo=mid+1;P(4,`${a[mid]} < ${x} → bỏ nửa trái, lo = ${lo}.`,{lo,hi,mid},X(mid))}else{hi=mid-1;P(5,`${a[mid]} > ${x} → bỏ nửa phải, hi = ${hi}.`,{lo,hi,mid},X(mid))}}
  O('-1');P(7,`Không có ${x} trong mảng. Chỉ mất ${c} lần so sánh.`,{lo,hi},X(-1));return steps}})}},
21:{t:'Chạy từng bước hai con trỏ: tìm cặp có tổng X',f(h){Tracer(h,{inputs:[{id:'a',label:'Mảng (tự sắp xếp) =',val:'1 3 4 6 8 11 14',w:220},{id:'x',label:'X =',val:'17',w:60}],
 code:['int i = 0, j = n - 1;','while (i < j) {','    int t = a[i] + a[j];','    if (t == X) { cout << a[i] << " " << a[j]; break; }','    else if (t < X) i++;','    else j--;','}'],
 gen(v){const a=v.a.trim().split(/[\s,]+/).map(Number).sort((p,q)=>p-q),X=Number(v.x);if(a.length<2||a.length>14||a.some(t=>!Number.isInteger(t)))return'Nhập 2–14 số nguyên.';
  const {steps,P,O}=mk();let i=0,j=a.length-1;const Y=()=>({arr:a,hi:i,mk:j,rg:[i,j],l1:'Ô xanh: con trỏ i · ô vàng: con trỏ j'});P(0,`i ở đầu trái, j ở đầu phải.`,{i,j},Y());
  while(true){const ok=i<j;P(1,`\`${i} < ${j}\` → ${ok?'tiếp tục':'**hai con trỏ gặp nhau, dừng**'}.`,{i,j},Y());if(!ok){P(6,`Không có cặp nào có tổng ${X}.`,{i,j},Y());break}
   const t=a[i]+a[j];P(2,`t = a[${i}] + a[${j}] = ${a[i]} + ${a[j]} = **${t}**.`,{i,j,t},Y());
   if(t===X){O(`${a[i]} ${a[j]}`);P(3,`t = X → **tìm thấy** cặp (${a[i]}, ${a[j]}).`,{i,j,t},Y());break}
   if(t<X){i++;P(4,`${t} < ${X}: tổng nhỏ → tăng i (mọi cặp với a[${i-1}] đều quá nhỏ).`,{i,j,t},Y())}else{j--;P(5,`${t} > ${X}: tổng lớn → giảm j.`,{i,j,t},Y())}}
  return steps}})}},
22:{t:'Đổi tiền: tham lam có luôn tối ưu?',f(h){
 h.innerHTML=`<div class="row"><label class="lab">Mệnh giá = <input id="c22" value="1 3 4" style="width:200px"></label><label class="lab">Số tiền = <input id="m22" value="6" style="width:80px"></label><button class="b" data-p="1 2 5 10 20 50">Mệnh giá kiểu VN</button><button class="b" data-p="1 3 4">Bộ {1, 3, 4}</button></div><div id="o22"></div>`;
 function u(){const c=[...new Set($('#c22',h).value.trim().split(/[\s,]+/).map(Number).filter(x=>Number.isInteger(x)&&x>0))].sort((a,b)=>b-a),M=num($('#m22',h).value,1,500);if(!c.length||M===null){$('#o22',h).innerHTML='<span class="bad">Nhập mệnh giá dương và số tiền 1–500.</span>';return}
  let r=M,g=[],rows='';for(const x of c){const k=Math.floor(r/x);if(k){rows+=`<tr><td class="mono">${x}</td><td>${k} tờ</td><td>còn ${r-k*x}</td></tr>`;for(let t=0;t<k;t++)g.push(x);r-=k*x}}
  const dp=Array(M+1).fill(Infinity),tr=Array(M+1).fill(0);dp[0]=0;for(let s=1;s<=M;s++)for(const x of c)if(x<=s&&dp[s-x]+1<dp[s]){dp[s]=dp[s-x]+1;tr[s]=x}
  let opt=[];if(isFinite(dp[M])){let s=M;while(s){opt.push(tr[s]);s-=tr[s]}}
  const same=r===0&&g.length===opt.length;
  $('#o22',h).innerHTML=`<div class="tr-grid"><div><h3>Tham lam: lấy tờ lớn nhất có thể</h3><table class="tbl"><tr><th>Mệnh giá</th><th>Lấy</th><th>Tiền còn lại</th></tr>${rows}</table><div class="note">${r?`❌ Còn dư ${r} đồng, tham lam <b>không đổi được</b>.`:`Tham lam: <b>${g.length} tờ</b> (${g.join(' + ')})`}</div></div>
  <div><h3>Tối ưu (quy hoạch động)</h3><div class="note">${opt.length?`Ít nhất: <b>${opt.length} tờ</b> (${opt.sort((a,b)=>b-a).join(' + ')})`:'Không có cách đổi.'}</div><div class="score" style="background:${same?'var(--okb)':'var(--badb)'};color:${same?'var(--ok)':'var(--bad)'}">${same?'✔ Tham lam cho kết quả tối ưu với dữ liệu này.':'✘ Phản ví dụ! Tham lam KHÔNG tối ưu.'}</div></div></div>`}
 h.addEventListener('input',u);h.addEventListener('click',e=>{if(e.target.dataset.p){$('#c22',h).value=e.target.dataset.p;u()}});u();}},
23:{t:'Chạy từng bước: dãy con tăng dài nhất (LIS)',f(h){Tracer(h,{inputs:[{id:'a',label:'Dãy a =',val:'3 1 4 1 5 9 2 6',w:220}],
 code:['for (int i = 0; i < n; i++) {','    dp[i] = 1;','    for (int j = 0; j < i; j++)','        if (a[j] < a[i])','            dp[i] = max(dp[i], dp[j] + 1);','}','// đáp án = max(dp[0..n-1])'],
 gen(v){const a=v.a.trim().split(/[\s,]+/).map(Number);if(a.length<1||a.length>8||a.some(t=>!Number.isInteger(t)))return'Nhập 1–8 số nguyên để dễ quan sát.';
  const {steps,P,O}=mk(),dp=a.map(()=>'?');const X=(i,j)=>({arr:a,hi:i,mk:j,arr2:[...dp],hi2:i,l1:'Dãy a (xanh: i, vàng: j):',l2:'dp[i] = độ dài LIS kết thúc tại a[i]:'});
  for(let i=0;i<a.length;i++){dp[i]=1;P(1,`i = ${i}: khởi tạo dp[${i}] = 1 (chỉ có a[${i}]).`,{i},X(i,-1));
   for(let j=0;j<i;j++){const ok=a[j]<a[i];P(3,`a[${j}] = ${a[j]} < a[${i}] = ${a[i]}? → ${ok?'đúng, có thể nối a['+i+'] vào sau dãy kết thúc tại a['+j+']':'sai'}.`,{i,j},X(i,j));
    if(ok&&dp[j]+1>dp[i]){dp[i]=dp[j]+1;P(4,`dp[${i}] = dp[${j}] + 1 = **${dp[i]}**.`,{i,j},X(i,j))}}}
  const m=Math.max(...dp);O(String(m));P(6,`Đáp án = max(dp) = **${m}**.`,{},X(dp.indexOf(m),-1));return steps}})}},
24:{t:'BFS tìm đường đi ngắn nhất trên lưới',f(h){
 const R=7,C=10;let W,d,fr,done,lv;const S=[0,0],T=[R-1,C-1];
 const base=['..........','.##.####..','.#.....#..','.#.###.#.#','...#...#..','.###.###..','.........T'];
 h.innerHTML=`<div class="row"><button class="b pri" id="st24">Bước tiếp ▶ (mở rộng 1 lớp)</button><button class="b" id="al24">▶▶ Chạy hết</button><button class="b" id="rs24">⟲ Đặt lại</button><button class="b" id="cl24">Xóa tường</button><button class="b" id="rd24">🎲 Tường ngẫu nhiên</button></div><div class="lab">Bấm vào ô để đặt/xóa tường. S: xuất phát, T: đích. Số trong ô = khoảng cách ngắn nhất từ S.</div><div id="g24" class="g2" style="grid-template-columns:repeat(${C},38px)"></div><div class="tnote" id="m24"></div>`;
 function reset(m){d=Array.from({length:R},()=>Array(C).fill(-1));d[S[0]][S[1]]=0;fr=[S];done=false;lv=0;draw(m||'Hàng đợi ban đầu chỉ có ô S với d = 0. Bấm <b>Bước tiếp</b>.')}
 function step(){if(done)return;const nf=[];for(const [x,y] of fr)for(const [u,v] of [[x-1,y],[x+1,y],[x,y-1],[x,y+1]])if(u>=0&&u<R&&v>=0&&v<C&&!W[u][v]&&d[u][v]<0){d[u][v]=d[x][y]+1;nf.push([u,v])}
  lv++;fr=nf;if(d[T[0]][T[1]]>=0){done=true;draw(`🎯 Đến đích T! Đường đi ngắn nhất dài <b>${d[T[0]][T[1]]}</b> bước (ô xanh lá).`);return}
  if(!nf.length){done=true;draw('❌ Hàng đợi rỗng mà chưa đến T → <b>không có đường đi</b>.');return}draw(`Lớp ${lv}: thêm ${nf.length} ô có khoảng cách ${lv} vào hàng đợi (ô vàng).`)}
 function path(){const P=new Set();if(d[T[0]][T[1]]<0)return P;let [x,y]=T;P.add(x+','+y);while(d[x][y]>0){for(const [u,v] of [[x-1,y],[x+1,y],[x,y-1],[x,y+1]])if(u>=0&&u<R&&v>=0&&v<C&&d[u][v]===d[x][y]-1){x=u;y=v;break}P.add(x+','+y)}return P}
 function draw(m){const P=done?path():new Set(),F=new Set(fr.map(p=>p+''));let g='';for(let i=0;i<R;i++)for(let j=0;j<C;j++){const s=i===S[0]&&j===S[1],t=i===T[0]&&j===T[1];let st='min-width:0;padding:4px 0;font-size:13px;';
   if(W[i][j])st+='background:#334155;border-color:#334155;color:#334155';else if(P.has(i+','+j))st+='background:#bbf7d0;border-color:#16a34a';else if(F.has(i+','+j))st+='background:#fef3c7;border-color:#d99a1c';else if(d[i][j]>=0)st+='background:#dbeafe;border-color:#93c5fd';
   g+=`<div class="cell" data-r="${i}" data-c="${j}" style="${st}">${s?'S':t?'T':W[i][j]?'#':d[i][j]>=0?d[i][j]:''}</div>`}$('#g24',h).innerHTML=g;$('#m24',h).innerHTML=m}
 const load=b=>{W=b.map(r=>[...r].map(c=>c==='#'))};load(base);
 $('#st24',h).onclick=step;$('#al24',h).onclick=()=>{let k=0;while(!done&&k++<200)step()};$('#rs24',h).onclick=()=>reset();
 $('#cl24',h).onclick=()=>{W=W.map(r=>r.map(()=>false));reset()};$('#rd24',h).onclick=()=>{W=W.map((r,i)=>r.map((_,j)=>(i+j>0&&!(i===T[0]&&j===T[1]))&&Math.random()<.28));reset()};
 $('#g24',h).onclick=e=>{const c=e.target.dataset;if(c.r===undefined)return;const i=+c.r,j=+c.c;if((i===S[0]&&j===S[1])||(i===T[0]&&j===T[1]))return;W[i][j]=!W[i][j];reset('Đã thay đổi tường — chạy lại BFS.')};reset();}}
};

<script type="text/plain" id="p1-1">
### Đề bài
Cho số nguyên không âm n. Hãy tính **tổng các chữ số** của n và cho biết n có **chia hết cho 3** hay không.
### Dữ liệu vào
Một số nguyên n (0 ≤ n ≤ 10^18).
### Kết quả
- Dòng 1: tổng các chữ số của n.
- Dòng 2: `YES` nếu n chia hết cho 3, ngược lại `NO`.
### Ví dụ
```
TONGCS.INP: 2026
TONGCS.OUT: 10
            NO
```
### Giới hạn
- 60% số test: n ≤ 10^9.
- 40% số test: n ≤ 10^18.
@@
Tách từng chữ số bằng `n % 10` và `n /= 10` (Bài 6). n đến 10^18 thì cần kiểu dữ liệu nào?
@@
Một số chia hết cho 3 khi và chỉ khi **tổng các chữ số** của nó chia hết cho 3.
@@
Dùng `long long` để chứa n ≤ 10^18 (nếu dùng `int` chỉ được 60% điểm). Tách chữ số bằng vòng `while`, sau đó dùng dấu hiệu chia hết cho 3 trên tổng chữ số. Độ phức tạp O(số chữ số) ≈ 19 bước.
@@
#include <bits/stdc++.h>
using namespace std;
int main() {
    freopen("TONGCS.INP", "r", stdin);
    freopen("TONGCS.OUT", "w", stdout);
    long long n;
    cin >> n;
    int s = 0;
    while (n > 0) {
        s += n % 10;
        n /= 10;
    }
    cout << s << '\n';
    cout << (s % 3 == 0 ? "YES" : "NO");
    return 0;
}
</script>
<script type="text/plain" id="p1-2">
### Đề bài
Một số nguyên dương được gọi là **số "ba ước"** nếu nó có **đúng 3 ước** dương. Ví dụ 4 có các ước 1, 2, 4 nên là số ba ước. Cho N, hãy đếm số lượng số ba ước trong đoạn [1, N].
### Dữ liệu vào
Một số nguyên N (1 ≤ N ≤ 10^12).
### Kết quả
Số lượng số ba ước không vượt quá N.
### Ví dụ
```
BAUOC.INP: 30
BAUOC.OUT: 3
```
Giải thích: 4, 9, 25.
### Giới hạn
- 50% số test: N ≤ 10^4.
- 50% số test: N ≤ 10^12.
@@
Với N nhỏ: duyệt từng số x ≤ N và đếm ước của x trong O(√x). Thử liệt kê các số ba ước nhỏ: 4, 9, 25, 49… em thấy chúng có đặc điểm gì?
@@
x có đúng 3 ước ⇔ x = p² với p là **số nguyên tố**. Vậy chỉ cần đếm số nguyên tố p ≤ √N ≤ 10^6 bằng **sàng Eratosthenes** (Bài 18).
@@
Nếu x = p² (p nguyên tố) thì ước của x là 1, p, p² — đúng 3 ước. Ngược lại, số có số ước lẻ phải là số chính phương, và chỉ bình phương số nguyên tố mới có đúng 3 ước. Tính r = ⌊√N⌋ (cẩn thận sai số số thực), sàng nguyên tố đến r rồi đếm. Độ phức tạp O(√N log log √N).
@@
#include <bits/stdc++.h>
using namespace std;
bool hop[1000001];
int main() {
    freopen("BAUOC.INP", "r", stdin);
    freopen("BAUOC.OUT", "w", stdout);
    long long N;
    cin >> N;
    long long r = sqrtl(N);
    while ((r + 1) * (r + 1) <= N) r++;   // sửa sai số của sqrt
    while (r * r > N) r--;
    hop[0] = hop[1] = true;
    for (long long p = 2; p * p <= r; p++)
        if (!hop[p])
            for (long long k = p * p; k <= r; k += p) hop[k] = true;
    int dem = 0;
    for (long long x = 2; x <= r; x++)
        if (!hop[x]) dem++;
    cout << dem;
    return 0;
}
</script>
<script type="text/plain" id="p1-3">
### Đề bài
Cho xâu s gồm các chữ cái thường. Hỏi có thể **xóa tối đa một ký tự** của s để được xâu **đối xứng** (đọc xuôi và ngược giống nhau) hay không?
### Dữ liệu vào
Một dòng chứa xâu s (1 ≤ độ dài ≤ 10^5).
### Kết quả
`YES` nếu làm được, ngược lại `NO`.
### Ví dụ
```
XAUDX.INP: abca
XAUDX.OUT: YES
```
Giải thích: xóa 'c' được "aba" (hoặc xóa 'b' được "aca").
### Giới hạn
- 50% số test: độ dài ≤ 1000.
- 50% số test: độ dài ≤ 10^5.
@@
Cách "trâu": thử xóa từng vị trí rồi kiểm tra đối xứng — O(n²), đủ cho 50% số test.
@@
Dùng **hai con trỏ** i ở đầu, j ở cuối, tiến vào giữa. Khi gặp s[i] ≠ s[j] lần đầu, chỉ có 2 lựa chọn: bỏ s[i] hoặc bỏ s[j]. Kiểm tra đoạn còn lại có đối xứng không.
@@
Hai con trỏ (Bài 21) đi vào giữa khi hai ký tự bằng nhau. Nếu đi hết thì xâu vốn đối xứng → YES. Nếu gặp vị trí khác nhau, ký tự bị xóa bắt buộc phải là s[i] hoặc s[j], nên chỉ cần kiểm tra s[i+1..j] hoặc s[i..j-1]. Độ phức tạp O(n).
@@
#include <bits/stdc++.h>
using namespace std;
string s;
bool doiXung(int i, int j) {
    while (i < j) {
        if (s[i] != s[j]) return false;
        i++; j--;
    }
    return true;
}
int main() {
    freopen("XAUDX.INP", "r", stdin);
    freopen("XAUDX.OUT", "w", stdout);
    cin >> s;
    int i = 0, j = s.size() - 1;
    while (i < j && s[i] == s[j]) { i++; j--; }
    if (i >= j || doiXung(i + 1, j) || doiXung(i, j - 1)) cout << "YES";
    else cout << "NO";
    return 0;
}
</script>
<script type="text/plain" id="p1-4">
### Đề bài
Cho dãy n số nguyên a1, a2, …, an. Hãy tìm một **đoạn con liên tiếp khác rỗng** có **tổng lớn nhất** và in ra tổng đó.
### Dữ liệu vào
- Dòng 1: số nguyên n (1 ≤ n ≤ 10^5).
- Dòng 2: n số nguyên ai (|ai| ≤ 10^9).
### Kết quả
Tổng lớn nhất tìm được.
### Ví dụ
```
DOANCON.INP: 9
             -2 1 -3 4 -1 2 1 -5 4
DOANCON.OUT: 6
```
Giải thích: đoạn 4 -1 2 1.
### Giới hạn
- 40% số test: n ≤ 300 · 30% số test: n ≤ 5000 · 30% số test: n ≤ 10^5.
@@
O(n³): thử mọi đoạn [l, r] và cộng. O(n²): dùng **mảng cộng dồn** (Bài 19) để tính tổng đoạn trong O(1).
@@
O(n): gọi cur = tổng lớn nhất của đoạn **kết thúc tại i**. Khi xét a[i]: hoặc nối vào đoạn trước (cur + a[i]), hoặc bắt đầu đoạn mới (a[i]).
@@
Đây là thuật toán Kadane — một bài quy hoạch động (Bài 23): cur(i) = max(a[i], cur(i−1) + a[i]), đáp án là giá trị cur lớn nhất. Chú ý: tổng có thể đến 10^14 nên dùng `long long`; dãy có thể toàn số âm nên khởi tạo best rất nhỏ, không phải 0.
@@
#include <bits/stdc++.h>
using namespace std;
int main() {
    freopen("DOANCON.INP", "r", stdin);
    freopen("DOANCON.OUT", "w", stdout);
    int n;
    cin >> n;
    long long cur = 0, best = LLONG_MIN;
    for (int i = 0; i < n; i++) {
        long long x;
        cin >> x;
        cur = max(x, cur + x);
        best = max(best, cur);
    }
    cout << best;
    return 0;
}
</script>
<script type="text/plain" id="p2-1">
### Đề bài
Buổi học bồi dưỡng bắt đầu lúc h giờ m phút và kéo dài t phút. Hãy cho biết buổi học **kết thúc lúc mấy giờ** (theo đồng hồ 24 giờ; sau 23:59 là 00:00 của ngày hôm sau).
### Dữ liệu vào
Ba số nguyên h, m, t (0 ≤ h ≤ 23; 0 ≤ m ≤ 59; 1 ≤ t ≤ 10^4).
### Kết quả
Hai số giờ và phút kết thúc, mỗi số in đúng **2 chữ số**, cách nhau một dấu cách.
### Ví dụ
```
LICHHOC.INP: 19 0 90
LICHHOC.OUT: 20 30

LICHHOC.INP: 23 30 45
LICHHOC.OUT: 00 15
```
@@
Đổi tất cả ra **phút** tính từ 00:00, cộng t, rồi đổi ngược lại giờ – phút bằng `/` và `%` (Bài 3).
@@
Một ngày có 1440 phút: lấy tổng % 1440 để quay vòng qua nửa đêm. In 2 chữ số bằng `printf("%02d")` hoặc `setw(2) << setfill('0')`.
@@
tong = (h × 60 + m + t) % 1440; giờ = tong / 60, phút = tong % 60. Lỗi hay gặp: quên quay vòng qua nửa đêm (in ra 24 giờ, 25 giờ…) và in "0 15" thay vì "00 15".
@@
#include <bits/stdc++.h>
using namespace std;
int main() {
    freopen("LICHHOC.INP", "r", stdin);
    freopen("LICHHOC.OUT", "w", stdout);
    int h, m, t;
    cin >> h >> m >> t;
    int tong = (h * 60 + m + t) % 1440;
    printf("%02d %02d", tong / 60, tong % 60);
    return 0;
}
</script>
<script type="text/plain" id="p2-2">
### Đề bài
Cho dãy n số nguyên a1, …, an và số X. Đếm số cặp chỉ số (i, j) với **i < j** sao cho ai + aj = X.
### Dữ liệu vào
- Dòng 1: n và X (1 ≤ n ≤ 10^5; |X| ≤ 2×10^9).
- Dòng 2: n số nguyên ai (|ai| ≤ 10^9).
### Kết quả
Số cặp tìm được.
### Ví dụ
```
DEMCAP.INP: 5 6
            1 5 3 3 2
DEMCAP.OUT: 2
```
Giải thích: (1, 5) và (3, 3).
### Giới hạn
- 50% số test: n ≤ 3000 · 50% số test: n ≤ 10^5.
@@
O(n²): hai vòng lặp i < j, đủ cho 50% số test.
@@
Duyệt j từ trái sang phải: số cặp có đầu phải là j bằng **số lần giá trị X − a[j] đã xuất hiện trước đó**. Đếm bằng `map` (Bài 14).
@@
Dùng map cnt lưu số lần xuất hiện của các giá trị đã duyệt. Với mỗi a[j]: cộng cnt[X − a[j]] vào đáp án rồi mới tăng cnt[a[j]] (để không ghép a[j] với chính nó). Đáp án có thể đến ~5×10^9 cặp → `long long`. Độ phức tạp O(n log n).
@@
#include <bits/stdc++.h>
using namespace std;
int main() {
    freopen("DEMCAP.INP", "r", stdin);
    freopen("DEMCAP.OUT", "w", stdout);
    int n;
    long long X;
    cin >> n >> X;
    map<long long, int> cnt;
    long long ans = 0;
    for (int j = 0; j < n; j++) {
        long long a;
        cin >> a;
        if (cnt.count(X - a)) ans += cnt[X - a];
        cnt[a]++;
    }
    cout << ans;
    return 0;
}
</script>
<script type="text/plain" id="p2-3">
### Đề bài
Cho dãy n số nguyên a1, …, an và q câu hỏi. Mỗi câu hỏi gồm hai số l, r — hãy tính tổng al + al+1 + … + ar.
### Dữ liệu vào
- Dòng 1: n và q (1 ≤ n, q ≤ 10^5).
- Dòng 2: n số nguyên ai (|ai| ≤ 10^9).
- q dòng tiếp theo: mỗi dòng hai số l, r (1 ≤ l ≤ r ≤ n).
### Kết quả
q dòng, mỗi dòng là đáp án của một câu hỏi.
### Ví dụ
```
TONGDOAN.INP: 5 2
              3 -1 4 1 5
              1 3
              2 5
TONGDOAN.OUT: 6
              9
```
### Giới hạn
- 50% số test: n, q ≤ 1000 · 50% số test: n, q ≤ 10^5.
@@
Cộng trực tiếp mỗi câu hỏi tốn O(n) → tổng O(n·q) = 10^10 với n, q = 10^5: quá thời gian.
@@
Mảng cộng dồn S[i] = S[i−1] + a[i] (Bài 19). Tổng đoạn = S[r] − S[l−1].
@@
Chuẩn bị mảng S trong O(n), mỗi câu hỏi trả lời O(1). Tổng tối đa 10^14 → `long long`. Nhập xuất 2×10^5 số nên thêm lệnh tăng tốc nhập xuất (Bài 16).
@@
#include <bits/stdc++.h>
using namespace std;
long long S[100005];
int main() {
    freopen("TONGDOAN.INP", "r", stdin);
    freopen("TONGDOAN.OUT", "w", stdout);
    ios::sync_with_stdio(false); cin.tie(0);
    int n, q;
    cin >> n >> q;
    for (int i = 1; i <= n; i++) {
        long long a;
        cin >> a;
        S[i] = S[i - 1] + a;
    }
    while (q--) {
        int l, r;
        cin >> l >> r;
        cout << S[r] - S[l - 1] << '\n';
    }
    return 0;
}
</script>
<script type="text/plain" id="p2-4">
### Đề bài
Mê cung là lưới n hàng, m cột; ô `.` đi được, ô `#` là tường. Từ một ô có thể đi sang 4 ô kề cạnh. Tìm **số bước ít nhất** để đi từ ô trên cùng bên trái (1, 1) đến ô dưới cùng bên phải (n, m). Nếu không đi được, in -1.
### Dữ liệu vào
- Dòng 1: n, m (1 ≤ n, m ≤ 1000).
- n dòng tiếp theo: mỗi dòng m ký tự `.` hoặc `#`.
### Kết quả
Số bước ít nhất, hoặc -1.
### Ví dụ
```
MECUNG.INP: 3 4
            ..#.
            .#..
            ....
MECUNG.OUT: 5
```
@@
Đường đi ngắn nhất trên lưới không trọng số → **BFS** (Bài 24), không dùng DFS.
@@
Mảng d[i][j] = số bước ít nhất đến ô (i, j), khởi tạo -1 (chưa thăm). Nếu ô xuất phát hoặc ô đích là tường thì in -1 ngay.
@@
BFS từ (0, 0) bằng queue, mỗi ô vào hàng đợi đúng một lần → O(n·m) = 10^6 phép tính. Đáp án là d[n−1][m−1] (giữ nguyên -1 nếu không đến được). Lưới 1000×1000 nên khai báo mảng toàn cục.
@@
#include <bits/stdc++.h>
using namespace std;
int n, m, d[1005][1005];
string a[1005];
int dx[4] = {-1, 1, 0, 0}, dy[4] = {0, 0, -1, 1};
int main() {
    freopen("MECUNG.INP", "r", stdin);
    freopen("MECUNG.OUT", "w", stdout);
    cin >> n >> m;
    for (int i = 0; i < n; i++) cin >> a[i];
    if (a[0][0] == '#' || a[n - 1][m - 1] == '#') { cout << -1; return 0; }
    memset(d, -1, sizeof d);
    queue<pair<int, int>> q;
    d[0][0] = 0; q.push({0, 0});
    while (!q.empty()) {
        int x = q.front().first, y = q.front().second; q.pop();
        for (int k = 0; k < 4; k++) {
            int u = x + dx[k], v = y + dy[k];
            if (u >= 0 && u < n && v >= 0 && v < m && a[u][v] == '.' && d[u][v] == -1) {
                d[u][v] = d[x][y] + 1;
                q.push({u, v});
            }
        }
    }
    cout << d[n - 1][m - 1];
    return 0;
}
</script>
<script type="text/plain" id="p3-1">
### Đề bài
Cho q câu hỏi, mỗi câu hỏi gồm hai số a, b. Hãy đếm số **số nguyên tố** trong đoạn [a, b].
### Dữ liệu vào
- Dòng 1: q (1 ≤ q ≤ 10^5).
- q dòng tiếp theo: mỗi dòng hai số a, b (1 ≤ a ≤ b ≤ 10^6).
### Kết quả
q dòng, mỗi dòng là đáp án tương ứng.
### Ví dụ
```
DEMNT.INP: 2
           1 10
           10 20
DEMNT.OUT: 4
           4
```
@@
Kiểm tra từng số trong đoạn bằng O(√x) có thể tốn 10^5 × 10^6 × … — quá chậm. Hãy tính trước!
@@
Sàng Eratosthenes đến 10^6 (Bài 18), rồi tạo mảng cộng dồn dem[x] = số số nguyên tố ≤ x (Bài 19). Đáp án = dem[b] − dem[a−1].
@@
Kết hợp hai kỹ thuật: sàng O(N log log N) một lần, sau đó mỗi câu hỏi O(1). Đây là mẫu "tiền xử lý + trả lời nhanh" rất hay gặp trong đề HSG.
@@
#include <bits/stdc++.h>
using namespace std;
const int N = 1000000;
bool hop[N + 1];
int dem[N + 1];
int main() {
    freopen("DEMNT.INP", "r", stdin);
    freopen("DEMNT.OUT", "w", stdout);
    ios::sync_with_stdio(false); cin.tie(0);
    hop[0] = hop[1] = true;
    for (int p = 2; p * p <= N; p++)
        if (!hop[p])
            for (int k = p * p; k <= N; k += p) hop[k] = true;
    for (int x = 1; x <= N; x++) dem[x] = dem[x - 1] + (!hop[x]);
    int q;
    cin >> q;
    while (q--) {
        int a, b;
        cin >> a >> b;
        cout << dem[b] - dem[a - 1] << '\n';
    }
    return 0;
}
</script>
<script type="text/plain" id="p3-2">
### Đề bài
Câu lạc bộ có n hoạt động, hoạt động thứ i diễn ra từ thời điểm si đến ei. Một bạn chỉ tham gia được một hoạt động tại một thời điểm; hoạt động sau được bắt đầu đúng lúc hoạt động trước kết thúc. Hỏi bạn tham gia được **nhiều nhất bao nhiêu hoạt động**?
### Dữ liệu vào
- Dòng 1: n (1 ≤ n ≤ 10^5).
- n dòng tiếp theo: mỗi dòng hai số si, ei (0 ≤ si < ei ≤ 10^9).
### Kết quả
Số hoạt động nhiều nhất.
### Ví dụ
```
CHONVIEC.INP: 5
              1 3
              2 5
              3 6
              5 7
              6 8
CHONVIEC.OUT: 3
```
Giải thích: chọn [1, 3], [3, 6], [6, 8].
@@
Thử các cách tham lam: chọn hoạt động ngắn nhất trước? bắt đầu sớm nhất trước? Hãy tìm phản ví dụ cho từng cách.
@@
Chọn hoạt động **kết thúc sớm nhất** trước (Bài 22): sắp xếp theo e tăng dần, rồi lần lượt chọn hoạt động có s ≥ thời điểm kết thúc của hoạt động vừa chọn.
@@
Kết thúc sớm nhất để lại nhiều thời gian nhất cho các hoạt động sau, nên tham lam này cho kết quả tối ưu. Lưu hoạt động bằng `pair` với first = e để `sort` mặc định sắp theo thời điểm kết thúc. Độ phức tạp O(n log n).
@@
#include <bits/stdc++.h>
using namespace std;
int main() {
    freopen("CHONVIEC.INP", "r", stdin);
    freopen("CHONVIEC.OUT", "w", stdout);
    int n;
    cin >> n;
    vector<pair<int, int>> hd(n);           // (kết thúc, bắt đầu)
    for (int i = 0; i < n; i++) cin >> hd[i].second >> hd[i].first;
    sort(hd.begin(), hd.end());
    int dem = 0, ketThuc = -1;
    for (auto p : hd)
        if (p.second >= ketThuc) {
            dem++;
            ketThuc = p.first;
        }
    cout << dem;
    return 0;
}
</script>
<script type="text/plain" id="p3-3">
### Đề bài
Cầu thang có n bậc, đánh số 1..n; bạn đứng ở mặt đất (bậc 0). Mỗi bước có thể leo lên **1, 2 hoặc 3 bậc**. Có k bậc bị hỏng, không được đặt chân lên. Đếm số cách leo lên đúng bậc n, chia lấy dư cho **10^9 + 7**.
### Dữ liệu vào
- Dòng 1: n và k (1 ≤ n ≤ 10^6; 0 ≤ k ≤ n).
- Dòng 2: k số là các bậc bị hỏng.
### Kết quả
Số cách leo, chia dư cho 10^9 + 7.
### Ví dụ
```
CAUTHANG.INP: 5 1
              3
CAUTHANG.OUT: 5
```
@@
Gọi f[i] = số cách đứng được trên bậc i. Bậc i có thể đến từ bậc nào?
@@
f[i] = f[i−1] + f[i−2] + f[i−3] (bỏ các chỉ số âm); nếu bậc i hỏng thì f[i] = 0. Cơ sở f[0] = 1.
@@
Quy hoạch động (Bài 23) O(n). Lấy dư sau mỗi phép cộng để không tràn số; f lưu bằng `long long`. Với ví dụ: f = 1, 1, 2, 0, 3, 5.
@@
#include <bits/stdc++.h>
using namespace std;
const long long MOD = 1000000007;
long long f[1000005];
bool hong[1000005];
int main() {
    freopen("CAUTHANG.INP", "r", stdin);
    freopen("CAUTHANG.OUT", "w", stdout);
    int n, k;
    cin >> n >> k;
    for (int i = 0; i < k; i++) { int x; cin >> x; hong[x] = true; }
    f[0] = 1;
    for (int i = 1; i <= n; i++) {
        if (hong[i]) { f[i] = 0; continue; }
        for (int b = 1; b <= 3; b++)
            if (i - b >= 0) f[i] = (f[i] + f[i - b]) % MOD;
    }
    cout << f[n];
    return 0;
}
</script>
<script type="text/plain" id="p3-4">
### Đề bài
Có n vị trí trên một con đường thẳng, vị trí thứ i có tọa độ xi. Cần đặt k trạm phát sóng vào k vị trí khác nhau sao cho **khoảng cách nhỏ nhất giữa hai trạm bất kỳ là lớn nhất**. In ra khoảng cách đó.
### Dữ liệu vào
- Dòng 1: n và k (2 ≤ k ≤ n ≤ 10^5).
- Dòng 2: n số nguyên xi đôi một khác nhau (0 ≤ xi ≤ 10^9).
### Kết quả
Khoảng cách nhỏ nhất lớn nhất có thể đạt được.
### Ví dụ
```
DATTRAM.INP: 5 3
             1 2 8 4 9
DATTRAM.OUT: 3
```
Giải thích: đặt tại 1, 4, 8 (hoặc 1, 4, 9).
@@
Đổi câu hỏi: "Với khoảng cách D cho trước, có đặt được k trạm mà mọi cặp trạm cách nhau ≥ D không?" — câu hỏi này kiểm tra bằng tham lam trên mảng đã sắp xếp.
@@
Nếu đặt được với D thì cũng đặt được với mọi giá trị nhỏ hơn D → tính **đơn điệu** → **chặt nhị phân kết quả** (Bài 20) để tìm D lớn nhất.
@@
Sắp xếp x. Hàm check(D): đặt trạm đầu ở x[0], đi tiếp và đặt trạm mới mỗi khi cách trạm vừa đặt ≥ D; đúng nếu đặt được ≥ k trạm. Chặt nhị phân D trong [0, 10^9]. Độ phức tạp O(n log n + n log 10^9).
@@
#include <bits/stdc++.h>
using namespace std;
int n, k;
vector<long long> x;
bool check(long long D) {
    int dem = 1;
    long long cuoi = x[0];
    for (int i = 1; i < n; i++)
        if (x[i] - cuoi >= D) { dem++; cuoi = x[i]; }
    return dem >= k;
}
int main() {
    freopen("DATTRAM.INP", "r", stdin);
    freopen("DATTRAM.OUT", "w", stdout);
    cin >> n >> k;
    x.resize(n);
    for (int i = 0; i < n; i++) cin >> x[i];
    sort(x.begin(), x.end());
    long long lo = 0, hi = 1000000000, ans = 0;
    while (lo <= hi) {
        long long mid = (lo + hi) / 2;
        if (check(mid)) { ans = mid; lo = mid + 1; }
        else hi = mid - 1;
    }
    cout << ans;
    return 0;
}

const $=(s,r=document)=>r.querySelector(s), esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const KW="int|long|double|float|char|bool|string|void|return|if|else|for|while|do|break|continue|switch|case|default|const|struct|using|namespace|true|false|auto|vector|pair|cin|cout|endl|greater|sort|reverse|getline";
const RX=new RegExp(`(\\/\\/.*$)|("(?:\\\\.|[^"\\\\])*"|'(?:\\\\.|[^'\\\\])*')|(^\\s*#\\s*\\w+.*$)|(\\b\\d+(?:\\.\\d+)?\\b)|(\\b(?:${KW})\\b)`,"gm");
function hl(src){let o="",i=0,m;RX.lastIndex=0;while((m=RX.exec(src))){o+=esc(src.slice(i,m.index));const cls=m[1]?'c':m[2]?'s':m[3]?'p':m[4]?'d':'k';o+=`<span class="${cls}">${esc(m[0])}</span>`;i=RX.lastIndex}return o+esc(src.slice(i))}
const inl=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
function md(t){const L=t.replace(/^\n+|\s+$/g,'').split('\n');let h='',i=0;
 while(i<L.length){let l=L[i];
  if(l.startsWith('```')){let c=[];i++;while(i<L.length&&!L[i].startsWith('```'))c.push(L[i++]);i++;h+=`<pre class="code">${hl(c.join('\n'))}</pre>`;continue}
  if(l.startsWith('### ')){h+=`<h3>${inl(l.slice(4))}</h3>`;i++;continue}
  if(l.startsWith('- ')){h+='<ul>';while(i<L.length&&L[i].startsWith('- '))h+=`<li>${inl(L[i++].slice(2))}</li>`;h+='</ul>';continue}
  if(l.startsWith('> ')){h+=`<div class="note">💡 ${inl(l.slice(2))}</div>`;i++;continue}
  if(l.trim())h+=`<p>${inl(l)}</p>`;i++}
 return h}

 <div class="tr-grid"><div class="tr-code"></div><div><div class="arr"></div><table class="vars"></table><div class="out"></div></div></div>

 let steps=[],k=0,timer=null;

 function load(){stop();const r=cfg.gen(vals());if(typeof r==='string'){steps=[{l:-1,v:{},o:'',n:'⚠️ '+r}]}else steps=r;k=0;draw()}

  const row=(A,hi,mk,rg)=>A.map((x,i)=>`<div class="cell ${i===hi?'hi':''} ${i===mk?'mk':''} ${rg&&(i<rg[0]||i>rg[1])?'dim':''}">${esc(x)}<small>[${i}]</small></div>`).join('');

}

 const M={row:['Hàng i','for (int j = 0; j < n; j++) s += a[i][j];'],col:['Cột j','for (int i = 0; i < n; i++) s += a[i][j];'],main:['Chéo chính','for (int i = 0; i < n; i++) s += a[i][i];   // i == j'],sub:['Chéo phụ','for (int i = 0; i < n; i++) s += a[i][n-1-i];   // i + j == n-1'],nb:['4 ô kề','// (i-1,j) (i+1,j) (i,j-1) (i,j+1)']};

 function inSet(i,j){const [r,c]=sel;return mode==='row'?i===r:mode==='col'?j===c:mode==='main'?i===j:mode==='sub'?i+j===n-1:mode==='nb'?Math.abs(i-r)+Math.abs(j-c)===1:false}

function home(){const done=CH.filter(c=>best(c[0])>=5).length;
 return `<div class="card hero"><div class="kicker" style="color:#fbbf24">Bồi dưỡng học sinh giỏi Tin học</div><h2>Học C++ bằng cách <span>nhìn thấy</span> từng dòng lệnh chạy</h2><p>Mỗi bài gồm: lý thuyết ngắn gọn → minh họa tương tác chạy từng bước → trắc nghiệm kiểm tra hiểu bài.</p><div class="row" style="margin-top:14px"><a href="#ch1" class="b pri" style="text-decoration:none">Bắt đầu Giai đoạn 1 →</a><a href="#ch13" class="b" style="text-decoration:none">Giai đoạn 2 →</a><span style="color:#c7d6ef">Đã hoàn thành ${done}/${CH.length} chương</span></div></div>
 <div class="card"><h3>Cách học hiệu quả</h3><ul><li>Đọc phần <b>Lý thuyết</b>, chép lại các đoạn code mẫu vào Dev-C++ và chạy thử.</li><li>Sang tab <b>Minh họa</b>: tự đổi dữ liệu, bấm <b>Bước tiếp ▶</b> và đoán trước kết quả rồi mới xem.</li><li>Làm <b>Trắc nghiệm</b>: đạt từ 5/6 câu (✅) mới chuyển sang chương sau. Làm sai thì đọc giải thích và làm lại.</li><li>Kết quả trắc nghiệm được lưu trên trình duyệt của em.</li></ul></div>
 <div class="phase">${[['Giai đoạn 1','Nền tảng ngôn ngữ C++ (Chương 1–12)','Đang mở'],['Giai đoạn 2','Cấu trúc dữ liệu và thuật toán (Bài 13–24)','Đang mở'],['Giai đoạn 3','Luyện đề và thi thử','Đang mở']].map(x=>`<div><div class="kicker">${x[2]}</div><b>${x[0]}</b><div class="lab">${x[1]}</div></div>`).join('')}</div>`}
function chapter(id,tab){const [i,t,G]=CH[id-1];
 const tabs=[['lt','📖 Lý thuyết'],['mh','🧪 Minh họa'],['tn','✍️ Trắc nghiệm']];
 let h=`<div class="card"><div class="kicker">${CH[id-1][3]||'Chương '+i}</div><h2 class="title">${t}</h2><div class="goals"><b>Mục tiêu</b><ul>${G.map(g=>`<li>${g}</li>`).join('')}</ul></div></div>
 <div class="tabs">${tabs.map(([k,n])=>`<button data-tab="${k}" class="${tab===k?'on':''}">${n}</button>`).join('')}</div><div class="card" id="body"></div>
 <div class="pager">${i>1?`<a href="#ch${i-1}"><small>← Chương trước</small>${CH[i-2][1]}</a>`:''}${i<CH.length?`<a class="r" href="#ch${i+1}"><small>Chương sau →</small>${CH[i][1]}</a>`:''}</div>`;
 return h}
function fillBody(id,tab){const b=$('#body');
 if(tab==='lt'){b.innerHTML=md($('#t'+id).textContent)+`<div class="row" style="margin-top:16px"><button class="b pri" data-go="mh">Xem minh họa →</button></div>`}
 if(tab==='mh'){b.innerHTML=`<div class="viz-h"><span class="tag">Tương tác</span><h3 style="margin:0">${VIZ[id].t}</h3></div><div id="viz"></div><div class="row" style="margin-top:16px"><button class="b pri" data-go="tn">Làm trắc nghiệm →</button></div>`;VIZ[id].f($('#viz'))}
 if(tab==='tn')quiz(id,b)}
function quiz(id,b){const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
 const qs=Q[id].map(([q,c,o,a,ex])=>{const ord=shuffle(o.map((t,k)=>[t,k===a]));return{q,c,ord,ex}});const pick={};const pb=best(id);
 b.innerHTML=`<div class="viz-h"><span class="tag">${qs.length} câu</span><h3 style="margin:0">Trắc nghiệm · ${CH[id-1][1]}</h3>${pb!==null?`<span class="lab" style="margin-left:auto">Điểm cao nhất: ${pb}/${qs.length}</span>`:''}</div>`+
 qs.map((x,i)=>`<div class="q" data-q="${i}"><div class="qt">Câu ${i+1}. ${x.q}</div>${x.c?`<pre class="code">${hl(x.c)}</pre>`:''}${x.ord.map((o,k)=>`<div class="opt" data-k="${k}"><span class="lt">${'ABCD'[k]}.</span><span>${o[0].startsWith('<')?o[0]:esc(o[0])}</span></div>`).join('')}<div class="ex">💡 ${x.ex}</div></div>`).join('')+
 `<div class="row"><button class="b pri" id="sub">Nộp bài</button><button class="b" id="again">↻ Làm lại (đảo đáp án)</button></div><div id="sc"></div>`;
 let done=false;
 b.onclick=e=>{const o=e.target.closest('.opt');if(o&&!done){const q=o.closest('.q');q.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));o.classList.add('sel');pick[q.dataset.q]=+o.dataset.k}
  if(e.target.id==='again')quiz(id,b);
  if(e.target.id==='sub'&&!done){if(Object.keys(pick).length<qs.length){$('#sc',b).innerHTML=`<div class="score" style="background:#fef3c7">Em còn ${qs.length-Object.keys(pick).length} câu chưa chọn đáp án.</div>`;return}
   done=true;let s=0;b.querySelectorAll('.q').forEach(q=>{const i=q.dataset.q,x=qs[i];q.classList.add('done');q.querySelectorAll('.opt').forEach((o,k)=>{if(x.ord[k][1])o.classList.add('ok');else if(+pick[i]===k)o.classList.add('no')});if(x.ord[pick[i]][1])s++});
   const prev=best(id);if(prev===null||s>prev)store.set('q'+id,s);
   const good=s>=5;$('#sc',b).innerHTML=`<div class="score" style="background:${good?'var(--okb)':'var(--badb)'};color:${good?'var(--ok)':'var(--bad)'}">${good?'🎉':'📚'} Kết quả: ${s}/${qs.length} câu đúng. ${good?'Em đã nắm vững chương này!':'Hãy đọc giải thích, xem lại minh họa rồi làm lại nhé.'}</div>`;$('#nav').innerHTML=navHTML(id)}
  const g=e.target.dataset.go;if(g)setTab(g)};
}
let cur='home',curTab='lt';
function setTab(t){curTab=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));fillBody(cur,t);$('.tabs').scrollIntoView({behavior:'smooth',block:'start'})}
function route(){clearInterval(TMR);const m=/^#ch(\d+)$/.exec(location.hash),hs=location.hash.slice(1);cur=m&&+m[1]>=1&&+m[1]<=CH.length?+m[1]:NEXT.some(x=>x[0]===hs)?hs:'home';curTab='lt';
 $('#nav').innerHTML=navHTML(cur);$('#nav').classList.remove('open');
 if(/^de\d$/.test(cur)){$('#main').innerHTML=dePage(+cur[2]);deInit(+cur[2])}else if(cur==='tongon'){$('#main').innerHTML=tongOn();tongOnInit()}else if(cur==='home'){$('#main').innerHTML=home()}else{$('#main').innerHTML=chapter(cur,curTab);fillBody(cur,curTab);$('.tabs').onclick=e=>{if(e.target.dataset.tab)setTab(e.target.dataset.tab)}}
 window.scrollTo(0,0)}
$('#menuBtn').onclick=()=>$('#nav').classList.toggle('open');
addEventListener('hashchange',route);route();
</script>
</body>
</html>
